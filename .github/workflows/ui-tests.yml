name: UI Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite'
        required: false
        default: 'ui'

permissions:
  contents: write

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npx playwright test tests/ui/specs/ --reporter=json,html
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        continue-on-error: true

      - name: Parse results & write summary JSON
        run: |
          node -e "
          const fs = require('fs');
          let raw;
          try { raw = JSON.parse(fs.readFileSync('test-results.json','utf8')); } catch(e) { raw = {}; }
          const suites = raw.suites || [];
          let passed = 0, failed = 0, total = 0;
          function walk(s) {
            (s.specs||[]).forEach(sp => {
              sp.tests.forEach(t => {
                total++;
                const ok = t.results.every(r => r.status === 'passed');
                ok ? passed++ : failed++;
              });
            });
            (s.suites||[]).forEach(walk);
          }
          suites.forEach(walk);
          const passRate = total > 0 ? Math.round(passed/total*100) : 0;
          const stats = raw.stats || {};
          const duration = stats.duration ? (stats.duration/1000).toFixed(1)+'s' : '';
          const out = { passed, failed, total, passRate, duration, htmlUrl: 'ui-report/index.html', pdfUrl: null, ts: new Date().toISOString() };
          fs.mkdirSync('gh-pages', { recursive: true });
          fs.writeFileSync('gh-pages/latest-ui.json', JSON.stringify(out, null, 2));
          console.log('Summary:', JSON.stringify(out));
          "

      - name: Upload UI Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Copy HTML report
        run: |
          mkdir -p gh-pages/ui-report
          cp -r playwright-report/. gh-pages/ui-report/ 2>/dev/null || true

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true
          destination_dir: .